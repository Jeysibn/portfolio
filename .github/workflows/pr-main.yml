name: Main PR Validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: main-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:

  # =========================================================
  # FRONTEND VALIDATION
  # =========================================================
  frontend:
    name: Frontend Production Readiness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate HTML
        run: |
          npx --yes htmlhint "frontend/**/*.html"

      - name: Validate JavaScript syntax
        run: |
          node --check frontend/js/chat.js
          node --check frontend/js/counter.js

      - name: Verify production files
        run: |
          test -f frontend/index.html
          test -f frontend/projects.html
          test -f frontend/resume.html
          test -f frontend/js/chat.js
          test -f frontend/js/counter.js

      - name: Create frontend artifact
        run: |
          tar \
            --exclude='*.tar.gz' \
            -czf frontend-build.tar.gz \
            frontend/

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-production-build
          path: frontend-build.tar.gz
          retention-days: 7


  # =========================================================
  # BACKEND VALIDATION
  # =========================================================
  backend:
    name: Backend Production Readiness
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install CI tools
        run: |
          pip install ruff pytest pip-audit

      - name: Check dependency compatibility
        run: pip check

      - name: Python syntax validation
        run: |
          python -m compileall function_app.py

      - name: Ruff lint
        run: |
          ruff check .

      - name: Dependency security audit
        run: |
          pip-audit -r requirements.txt

      - name: Run backend tests
        shell: bash
        run: |
          if find tests -name "test_*.py" -type f -size +0c | grep -q .; then
            pytest -v
          else
            echo "No implemented backend tests yet."
          fi


  # =========================================================
  # BACKEND PRODUCTION BUILD
  # =========================================================
  backend-build:
    name: Build Azure Function Package
    runs-on: ubuntu-latest
    needs:
      - backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Azure Function dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            -r backend/requirements.txt \
            --target="backend/.python_packages/lib/site-packages"

      - name: Verify Azure Function package
        run: |
          test -f backend/function_app.py
          test -f backend/host.json
          test -d backend/.python_packages

      - name: Create backend artifact
        run: |
          cd backend
          zip -r ../backend-function.zip . \
            -x ".venv/*" \
               "__pycache__/*" \
               "tests/*"

      - name: Upload backend build
        uses: actions/upload-artifact@v4
        with:
          name: azure-function-production-build
          path: backend-function.zip
          retention-days: 7


  # =========================================================
  # TERRAFORM VALIDATION
  # =========================================================
  terraform:
    name: Terraform Production Readiness
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform initialize
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate


  # =========================================================
  # FINAL PR GATE
  # =========================================================
  production-ready:
    name: Production Ready
    runs-on: ubuntu-latest

    needs:
      - frontend
      - backend
      - backend-build
      - terraform

    steps:
      - name: Production readiness summary
        run: |
          echo "======================================"
          echo " Production Readiness Checks Passed"
          echo "======================================"
          echo ""
          echo "Frontend validation:      PASSED"
          echo "Backend validation:       PASSED"
          echo "Dependency audit:         PASSED"
          echo "Backend build:            PASSED"
          echo "Terraform validation:     PASSED"
          echo ""
          echo "Pull Request is ready for merge into main."