name: Development CI

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # =========================================================
  # FRONTEND
  # =========================================================
  frontend:
    name: Frontend Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate HTML
        run: |
          npx --yes htmlhint "frontend/**/*.html"

      - name: Validate JavaScript syntax
        run: |
          node --check frontend/js/chat.js
          node --check frontend/js/counter.js

      - name: Verify required frontend files
        run: |
          test -f frontend/index.html
          test -f frontend/projects.html
          test -f frontend/resume.html
          test -f frontend/js/chat.js
          test -f frontend/js/counter.js

  # =========================================================
  # BACKEND
  # =========================================================
  backend:
    name: Backend Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Check installed dependencies
        run: pip check

      - name: Python syntax validation
        run: |
          python -m compileall function_app.py

      - name: Run Ruff
        run: |
          ruff check .

      - name: Run backend tests
        run: python -m pytest -v

  # =========================================================
  # TERRAFORM
  # =========================================================
  terraform:
    name: Terraform Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  # =========================================================
  # FINAL GATE
  # =========================================================
  ci-success:
    name: Development CI Passed
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
      - terraform

    steps:
      - name: CI Summary
        run: |
          echo "Frontend checks passed."
          echo "Backend checks and tests passed."
          echo "Terraform checks passed."
          echo "Development branch is ready for Pull Request."
