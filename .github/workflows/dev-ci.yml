name: Development CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # =========================================================
  # FRONTEND
  # =========================================================
  frontend:
    name: Frontend Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/app

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run frontend validation suite
        run: npm run validate:ci

      - name: Verify production artifact
        run: |
          test -f dist/index.html
          test -d dist/assets
          test -n "$(find dist/assets -maxdepth 1 -type f -name '*.js' -print -quit)"
          test -n "$(find dist/assets -maxdepth 1 -type f -name '*.css' -print -quit)"

  # =========================================================
  # BACKEND
  # =========================================================
  backend:
    name: Backend Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Check installed dependencies
        run: pip check

      - name: Python syntax validation
        run: |
          python -m compileall function_app.py

      - name: Validate approved knowledge artifact
        run: |
          python tools/build_knowledge.py --check
          python -m evals.run_evals

      - name: Run Ruff
        run: |
          ruff check .

      - name: Run backend tests
        run: python -m pytest -v

  # =========================================================
  # TERRAFORM
  # =========================================================
  terraform:
    name: Terraform Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  # =========================================================
  # FINAL GATE
  # =========================================================
  ci-success:
    name: Development CI Passed
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
      - terraform

    steps:
      - name: CI Summary
        run: |
          echo "React + TypeScript frontend checks passed."
          echo "Backend, knowledge consistency, and assistant retrieval evaluations passed."
          echo "Terraform checks passed."
          echo "Development validation passed."
