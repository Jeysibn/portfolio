name: Publish Frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-deploy.yml"

permissions:
  contents: read

concurrency:
  group: production-frontend
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Publish Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend/app
        run: npm install --no-audit --no-fund

      - name: Typecheck frontend
        working-directory: frontend/app
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend/app
        run: npm run build

      - name: Verify frontend artifact
        run: |
          test -f frontend/app/dist/index.html
          test -d frontend/app/dist/assets

      - name: Checkout GitHub Pages repository
        uses: actions/checkout@v7
        with:
          repository: Jeysibn/jeysibn.github.io
          ref: main
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: pages-site

      - name: Publish frontend artifact
        run: |
          set -euo pipefail

          rsync -a --delete --exclude='.git' frontend/app/dist/ pages-site/
          touch pages-site/.nojekyll

          cd pages-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No frontend changes to publish."
            exit 0
          fi

          git commit -m "deploy: portfolio ${GITHUB_SHA}"
          git push origin main

      - name: Verify deployed frontend
        env:
          PAGE_URL: https://jeysibn.github.io/
        run: |
          set -euo pipefail

          for attempt in {1..6}; do
            if page=$(curl --silent --show-error --fail --max-time 15 "$PAGE_URL"); then
              if grep -q "Jerome Ibon" <<< "$page"; then
                echo "GitHub Pages smoke test passed."
                exit 0
              fi
            fi

            echo "Frontend verification attempt $attempt/6 failed; retrying in 10 seconds..."
            sleep 10
          done

          echo "GitHub Pages deployment could not be verified."
          exit 1

      - name: Deployment summary
        if: success()
        run: |
          echo "## React Frontend Deployment ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Vite production build published to Jeysibn/jeysibn.github.io and verified on GitHub Pages." >> "$GITHUB_STEP_SUMMARY"
          echo "**Source commit:** ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**URL:** https://jeysibn.github.io/" >> "$GITHUB_STEP_SUMMARY"
