name: Publish Frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "content/**"
      - ".github/workflows/frontend-deploy.yml"

permissions:
  contents: read

concurrency:
  group: production-frontend
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Publish Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend/app
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        working-directory: frontend/app
        run: npx playwright install --with-deps chromium

      - name: Run frontend validation suite
        working-directory: frontend/app
        run: npm run validate:ci

      - name: Verify frontend artifact
        run: |
          test -f frontend/app/dist/index.html
          test -d frontend/app/dist/assets

      - name: Checkout GitHub Pages repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Jeysibn/jeysibn.github.io
          ref: main
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: pages-site

      - name: Publish frontend artifact
        run: |
          set -euo pipefail

          rsync -a --delete --exclude='.git' frontend/app/dist/ pages-site/
          touch pages-site/.nojekyll

          cd pages-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No frontend changes to publish."
            exit 0
          fi

          git commit -m "deploy: portfolio ${GITHUB_SHA}"
          git push origin main

      - name: Wait for GitHub Pages to serve the new build
        run: bash frontend/app/scripts/verify-published.sh https://jeysibn.github.io frontend/app/dist 30 10

      - name: Deployment summary
        if: success()
        run: |
          echo "## React Frontend Deployment ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Vite production build published to Jeysibn/jeysibn.github.io; GitHub Pages was confirmed to serve every built file byte for byte." >> "$GITHUB_STEP_SUMMARY"
          echo "**Source commit:** ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**URL:** https://jeysibn.github.io/" >> "$GITHUB_STEP_SUMMARY"
