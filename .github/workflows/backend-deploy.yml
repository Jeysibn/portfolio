name: Deploy Backend to Azure Functions

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-backend
  cancel-in-progress: false

env:
  AZURE_FUNCTIONAPP_NAME: func-jeysibn-portfolio
  PYTHON_VERSION: "3.11"

jobs:
  deploy:
    name: Deploy Azure Function
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            -r backend/requirements.txt \
            --target="backend/.python_packages/lib/site-packages"

      - name: Login to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Stamp deployment version
        run: |
          az functionapp config appsettings set \
            --resource-group rg-jeysibn-portfolio \
            --name "$AZURE_FUNCTIONAPP_NAME" \
            --settings APP_VERSION="${GITHUB_SHA::12}" \
            --output none

      - name: Deploy Azure Function
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ./backend

      - name: Verify production health
        env:
          HEALTH_URL: https://${{ env.AZURE_FUNCTIONAPP_NAME }}.azurewebsites.net/api/health
        run: |
          set -euo pipefail

          for attempt in {1..12}; do
            if response=$(curl --silent --show-error --fail \
              --max-time 15 \
              "$HEALTH_URL"); then
              if printf '%s' "$response" | python -c 'import json,sys; payload=json.load(sys.stdin); assert payload["status"] == "healthy"; assert payload["service"] == "portfolio-api"; print("Health response validated:", payload)'; then
                exit 0
              fi
            fi

            echo "Health check attempt $attempt/12 failed; retrying in 10 seconds..."
            sleep 10
          done

          echo "Production health verification failed."
          exit 1

      - name: Smoke test visitor counter API
        run: |
          curl --silent --show-error --fail \
            --max-time 15 \
            "https://${AZURE_FUNCTIONAPP_NAME}.azurewebsites.net/api/GetVisitorCount" \
            | python -c 'import json,sys; payload=json.load(sys.stdin); assert isinstance(payload.get("count"), int); print("Visitor counter smoke test passed")'

      - name: Deployment summary
        if: success()
        run: |
          echo "## Backend Deployment + Verification ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Azure Function deployed and production smoke tests passed." >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Health:** https://${AZURE_FUNCTIONAPP_NAME}.azurewebsites.net/api/health" >> "$GITHUB_STEP_SUMMARY"
