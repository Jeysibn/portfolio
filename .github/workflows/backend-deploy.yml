name: Deploy Backend to Azure Functions

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "content/**"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-backend
  cancel-in-progress: false

env:
  AZURE_FUNCTIONAPP_NAME: func-jeysibn-portfolio
  PYTHON_VERSION: "3.11"

jobs:
  deploy:
    name: Deploy Azure Function
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Validate backend source
        run: |
          python backend/tools/build_knowledge.py --check
          python -m py_compile backend/function_app.py

      - name: Login to Azure using OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # PR #102 introduced azure-identity, which pulls native cryptography
      # dependencies. Building .python_packages on the GitHub Ubuntu image can
      # produce wheels that do not match the Azure Functions Linux runtime.
      # Remove the old local-build package setting and let Oryx resolve the
      # dependencies inside Azure's runtime-compatible build environment.
      - name: Prepare Python remote build
        run: |
          set -euo pipefail
          az functionapp config appsettings delete \
            --resource-group rg-jeysibn-portfolio \
            --name "$AZURE_FUNCTIONAPP_NAME" \
            --setting-names WEBSITE_RUN_FROM_PACKAGE \
            --output none || true

      - name: Deploy Azure Function
        uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1.5.7
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ./backend
          scm-do-build-during-deployment: true
          enable-oryx-build: true

      - name: Set deployed revision metadata
        run: |
          set -euo pipefail

          # Azure CLI returns all configured settings from this command. Suppress
          # its JSON output so existing secret values cannot enter the job log.
          az functionapp config appsettings set \
            --resource-group rg-jeysibn-portfolio \
            --name "$AZURE_FUNCTIONAPP_NAME" \
            --settings "APP_REVISION=$GITHUB_SHA" \
            --output none

      - name: Verify Azure indexed the functions
        run: |
          set -euo pipefail

          for attempt in {1..12}; do
            functions=$(az functionapp function list \
              --resource-group rg-jeysibn-portfolio \
              --name "$AZURE_FUNCTIONAPP_NAME" \
              --query "[].name" \
              --output tsv 2>/dev/null || true)

            if printf '%s\n' "$functions" | grep -q '/Health$'; then
              echo "Azure Function indexing validated."
              exit 0
            fi

            echo "Function indexing attempt $attempt/12 found no Health function; retrying in 10 seconds..."
            sleep 10
          done

          echo "Azure did not index the deployed Health function."
          exit 1

      - name: Verify production health
        env:
          HEALTH_URL: https://${{ env.AZURE_FUNCTIONAPP_NAME }}.azurewebsites.net/api/health
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail

          for attempt in {1..12}; do
            if response=$(curl --silent --show-error --fail \
              --max-time 15 \
              "$HEALTH_URL"); then
              if printf '%s' "$response" | python -c 'import json,os,re,sys; payload=json.load(sys.stdin); assert payload.get("status") == "healthy", "backend is not healthy"; assert payload.get("service") == "portfolio-api", "unexpected backend service"; assert payload.get("revision") == os.environ["EXPECTED_REVISION"], "deployed backend revision does not match workflow commit"; assert re.fullmatch(r"\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?", payload.get("version", "")), "application semantic version is missing or invalid"; assert payload.get("environment") == "production", "unexpected environment"; print("Health and deployed revision validated:", payload["revision"])'; then
                exit 0
              fi
            fi

            echo "Health check attempt $attempt/12 failed; retrying in 10 seconds..."
            sleep 10
          done

          echo "Production health verification failed."
          exit 1

      - name: Deployment summary
        if: success()
        run: |
          echo "## Backend Deployment + Verification ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Azure Function remote build, indexing, liveness, and revision checks passed." >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Health:** https://${AZURE_FUNCTIONAPP_NAME}.azurewebsites.net/api/health" >> "$GITHUB_STEP_SUMMARY"
