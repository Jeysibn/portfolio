<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Jerome Ibon — Cloud and DevOps engineering portfolio focused on automation, infrastructure, observability, and cloud engineering."
    />
    <meta property="og:title" content="Jerome Ibon | Cloud & DevOps Engineering Portfolio" />
    <meta
      property="og:description"
      content="A production-style Cloud and DevOps portfolio with Terraform-managed Azure infrastructure, GitHub Actions delivery, observability, and Kubernetes GitOps work."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jeysibn.github.io/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jerome Ibon | Cloud & DevOps Engineering Portfolio" />
    <meta
      name="twitter:description"
      content="A production-style Cloud and DevOps portfolio with Terraform-managed Azure infrastructure, GitHub Actions delivery, observability, and Kubernetes GitOps work."
    />
    <meta name="twitter:image" content="https://jeysibn.github.io/social-preview.svg" />
    <meta name="theme-color" content="#0b0f0d" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      (() => {
        const stored = localStorage.getItem("color-theme");
        const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const theme = stored === "light" || stored === "dark" ? stored : systemDark ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap"
      rel="stylesheet"
    />
    <title>Jerome Ibon | Cloud & DevOps Engineer</title>
  </head>
