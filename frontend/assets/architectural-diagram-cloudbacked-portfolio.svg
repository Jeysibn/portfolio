<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">Cloud-backed portfolio architecture</title><desc id="desc">GitHub Actions publishes React to GitHub Pages and deploys Python APIs to Azure Functions using OIDC. The browser calls Functions, which uses Cosmos DB, an external AI provider, Application Insights, and Log Analytics.</desc>
  <style>.bg{fill:#eef2f1}.box{fill:#fff;stroke:#89968f;stroke-width:2}.line{fill:none;stroke:#57655d;stroke-width:4}.dash{stroke-dasharray:10 9}.title{font:600 34px IBM Plex Sans,Arial,sans-serif;fill:#1c211d}.label{font:600 22px IBM Plex Sans,Arial,sans-serif;fill:#1c211d}.body{font:400 17px IBM Plex Sans,Arial,sans-serif;fill:#4f5850}.meta{font:500 15px IBM Plex Mono,monospace;fill:#a9472b}</style>
  <rect class="bg" width="1600" height="960"/><text class="title" x="70" y="74">Cloud-Backed Portfolio / Current System Map</text><text class="body" x="70" y="108">Static delivery, serverless APIs, managed persistence, observability, and independent release paths.</text>
  <rect class="box" x="80" y="368" width="240" height="126" rx="6"/><text class="label" x="120" y="416">Browser</text><text class="body" x="120" y="452">React + TypeScript</text><text class="meta" x="120" y="480">jeysibn.github.io</text>
  <rect class="box" x="460" y="170" width="280" height="130" rx="6"/><text class="label" x="500" y="218">GitHub Actions</text><text class="body" x="500" y="254">Validation + delivery</text><text class="meta" x="500" y="280">AZURE OIDC</text>
  <rect class="box" x="460" y="568" width="280" height="130" rx="6"/><text class="label" x="500" y="616">GitHub Pages</text><text class="body" x="500" y="652">Dedicated publish repository</text><text class="meta" x="500" y="678">STATIC FRONTEND</text>
  <rect class="box" x="850" y="368" width="280" height="126" rx="6"/><text class="label" x="890" y="416">Azure Functions</text><text class="body" x="890" y="452">Python v2 HTTP APIs</text><text class="meta" x="890" y="480">HEALTH · VISITOR · AI</text>
  <rect class="box" x="1260" y="154" width="260" height="112" rx="6"/><text class="label" x="1300" y="202">Cosmos DB</text><text class="body" x="1300" y="236">Hashed IDs + TTL records</text>
  <rect class="box" x="1260" y="376" width="260" height="112" rx="6"/><text class="label" x="1300" y="424">AI provider</text><text class="body" x="1300" y="458">Credential stays server-side</text>
  <rect class="box" x="1260" y="598" width="260" height="126" rx="6"/><text class="label" x="1300" y="646">Application Insights</text><text class="body" x="1300" y="680">Requests + failures</text><text class="meta" x="1300" y="706">LOG ANALYTICS</text>
  <path class="line" d="M320 431H850M740 235H990V368M600 300V568M740 633H790V431H850"/><path class="line" d="M1130 397C1200 397 1190 210 1260 210M1130 432H1260M1130 468C1200 468 1190 661 1260 661"/>
  <path class="line dash" d="M80 820H1520"/><text class="meta" x="80" y="862">OPERATING BOUNDARIES</text><text class="body" x="80" y="898">Health proves Function worker liveness. It does not prove Cosmos DB or the external provider is healthy.</text>
</svg>
